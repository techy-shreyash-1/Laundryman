<style>
  /* Global Resets & Theme Variables */

  /* ==========================================
      DESKTOP HEADER
  ========================================== */

    top: 0;

  .hdr-nav {

    align-items: center;

    padding: 14px 24px;

  .hdr.scrolled .hdr-nav {

  }

  .hdr-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: inherit;
    flex-shrink: 0;

  .hdr-logo-mark {

    height: 38px;
    border-radius: 8px;

    align-items: center;

    flex-shrink: 0;

  .hdr-logo-mark img {

  .hdr-logo-text .tag {

    letter-spacing: 0.02em;
  }

  .hdr-right {
    display: flex;
    align-items: center;
    gap: 30px;
  }

  .hdr-links {
    display: flex;
    align-items: center;
    gap: 28px;
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .hdr-links a {

    font-weight: 600;
    color: #46464c;
    text-decoration: none;
    position: relative;
    padding: 8px 0;

  }

  .hdr-links a::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: 0;
    width: 0;
    height: 2.5px;
    background: var(--pink);
    border-radius: 4px;

  }

  .hdr-links a:hover,

  }

  .hdr-links a:hover::after,
  .hdr-links a.active::after {

  }

  .hdr-btns-wrap {

  }

  .hdr-btn {

  ========================================== */

<!-- ==========================================
      HEADER JAVASCRIPT LOGIC
========================================== -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const mainHeader = document.getElementById("mainHeader");
    const backdrop = document.getElementById("hdrSheetBackdrop");

    // Scroll styling for desktop header
    const handleScroll = () => {
      if (window.scrollY > 40) mainHeader.classList.add("scrolled");
      else mainHeader.classList.remove("scrolled");
    };
    window.addEventListener("scroll", handleScroll);
    handleScroll();

    // Drawer helper functions
    function openMenu() {
      if (!backdrop) return;
      backdrop.classList.add("open");
      document.body.classList.add("hdr-menu-open");
    }

    function closeMenu() {
      if (!backdrop) return;
      backdrop.classList.remove("open");
      document.body.classList.remove("hdr-menu-open");
    }

    // Global listener for opening/closing bottom drawer
    document.addEventListener("click", function (e) {
      if (e.target.closest("#hdrBottomMenuBtn")) {
        e.preventDefault();
        e.stopPropagation();
        openMenu();
        return;
      }

      if (e.target.closest("#hdrSheetClose") || e.target === backdrop) {
        e.preventDefault();
        closeMenu();
        return;
      }

      if (e.target.closest("#hdrSheetBackdrop .hdr-sheet-item")) {
        closeMenu();
      }
    });

    // Close on ESC key
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") closeMenu();
    });
  });
</script>
