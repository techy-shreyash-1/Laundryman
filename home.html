<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Laundryman Dryclean Services</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            background: #fff;
        }

        /* =========================
           NAVBAR
        ========================== */

        .navbar {
            height: 100px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6%;
            position: relative;
            z-index: 100;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.06);
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            color: #680849;
        }

        .logo span {
            color: #d10a71;
        }

        .nav-links {
            display: flex;
            gap: 35px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: #333;
            font-weight: 600;
            font-size: 15px;
            transition: 0.3s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #c9006b;
        }

        .nav-btns {
            display: flex;
            gap: 15px;
        }

        .call-btn {
            padding: 13px 25px;
            border: 1px solid #c9006b;
            border-radius: 8px;
            text-decoration: none;
            color: #b40060;
            font-weight: 600;
        }

        .login-btn {
            padding: 13px 25px;
            border-radius: 8px;
            text-decoration: none;
            background: #16833c;
            color: white;
            font-weight: 600;
        }

        .mobile-menu {
            display: none;
            font-size: 25px;
            cursor: pointer;
            color: #72004d;
        }


        /* =========================
           HERO SECTION
        ========================== */

        .hero {
            min-height: 760px;
            position: relative;
            overflow: hidden;

            background:
                radial-gradient(circle at center,
                    rgba(205, 31, 122, 0.35),
                    transparent 35%),

                linear-gradient(
                    135deg,
                    #260019 0%,
                    #570035 40%,
                    #760547 65%,
                    #250019 100%
                );

            display: flex;
            align-items: center;
            justify-content: center;
        }


        /* Background Laundryman Image */

        .brand-bg {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);

            width: 620px;
            max-width: 65%;

            opacity: 0.23;

            z-index: 1;
        }

        .brand-bg img {
            width: 100%;
            display: block;
            filter: brightness(1.2);
        }


        /* =========================
           WASHING MACHINES
        ========================== */

        .machine {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);

            width: 35%;
            height: 100%;

            overflow: hidden;
            z-index: 3;
        }

        .machine img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }


        .left-machine {
            left: 0;
        }

        .right-machine {
            right: 0;
            transform: translateY(-50%) scaleX(-1);
        }


        /* Dark overlay */

        .machine::after {
            content: "";
            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    90deg,
                    rgba(20, 0, 15, 0.15),
                    rgba(20, 0, 15, 0.55)
                );
        }

        .left-machine::after {
            background:
                linear-gradient(
                    90deg,
                    rgba(20, 0, 15, 0.2),
                    rgba(20, 0, 15, 0.65)
                );
        }


        /* =========================
           CENTER CONTENT
        ========================== */

        .hero-content {
            position: relative;
            z-index: 10;

            width: 600px;
            max-width: 90%;

            text-align: center;
            color: white;

            padding-top: 40px;
        }


        /* Laundryman Logo Image */

        .main-brand {
            width: 520px;
            max-width: 95%;
            margin: 0 auto 15px;
        }

        .main-brand img {
            width: 100%;
            max-height: 180px;
            object-fit: contain;

            filter:
                drop-shadow(0 10px 15px rgba(0,0,0,0.3));
        }


        /* =========================
           CIRCULAR IMAGE
        ========================== */

        .circle-wrapper {
            width: 310px;
            height: 310px;

            margin: 15px auto 20px;

            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        /* Outer glow */

        .circle-wrapper::before {
            content: "";

            position: absolute;

            width: 340px;
            height: 340px;

            border-radius: 50%;

            border: 2px solid rgba(255, 255, 255, 0.25);

            box-shadow:
                0 0 30px rgba(255, 0, 145, 0.6),
                0 0 70px rgba(255, 0, 145, 0.25);

            animation: rotateCircle 12s linear infinite;
        }


        /* Animated dashed circle */

        .circle-wrapper::after {
            content: "";

            position: absolute;

            width: 370px;
            height: 370px;

            border-radius: 50%;

            border: 1px dashed rgba(255, 208, 25, 0.5);

            animation: rotateReverse 20s linear infinite;
        }


        .circle-image {
            width: 290px;
            height: 290px;

            border-radius: 50%;

            overflow: hidden;

            position: relative;

            z-index: 2;

            border: 8px solid rgba(255, 255, 255, 0.9);

            background: white;

            box-shadow:
                0 0 30px rgba(255, 255, 255, 0.4),
                0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .circle-image img {
            width: 100%;
            height: 100%;

            object-fit: cover;
            object-position: center;

            display: block;
        }


        /* =========================
           DRY CLEAN BADGE
        ========================== */

        .dry-badge {
            position: absolute;

            right: -40px;
            bottom: 25px;

            width: 105px;
            height: 105px;

            z-index: 5;

            border-radius: 22px;

            background:
                linear-gradient(
                    145deg,
                    #3d273a,
                    #170b16
                );

            border: 1px solid rgba(255,255,255,0.25);

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            box-shadow:
                0 15px 30px rgba(0,0,0,0.4);
        }

        .dry-badge i {
            color: white;

            width: 38px;
            height: 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #c9006b;

            margin-bottom: 6px;
        }

        .dry-badge span {
            font-size: 9px;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .dry-badge strong {
            color: #ffd523;
            font-size: 13px;
        }


        /* =========================
           TEXT
        ========================== */

        .premium-text {
            margin-top: 20px;

            color: #ffd523;

            font-size: 11px;
            font-weight: 700;

            letter-spacing: 3px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 12px;
        }

        .premium-text::before,
        .premium-text::after {
            content: "";

            width: 55px;
            height: 2px;

            background: #ffd523;
        }


        .hero-title {
            margin-top: 10px;

            font-size: 62px;

            line-height: 1.05;

            font-weight: 800;

            letter-spacing: -2px;
        }

        .hero-title span {
            display: block;

            color: #ffd523;
        }


        /* =========================
           BUTTONS
        ========================== */

        .hero-buttons {
            display: flex;

            justify-content: center;

            gap: 15px;

            margin-top: 25px;
        }

        .hero-buttons a {
            padding: 15px 28px;

            border-radius: 40px;

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;

            transition: 0.3s;
        }

        .inquire-btn {
            background:
                linear-gradient(
                    135deg,
                    #2bb55e,
                    #087034
                );

            color: white;

            box-shadow:
                0 10px 25px rgba(0,0,0,0.25);
        }

        .view-btn {
            color: white;

            border: 1px solid rgba(255,255,255,0.5);

            background: rgba(255,255,255,0.08);

            backdrop-filter: blur(10px);
        }

        .hero-buttons a:hover {
            transform: translateY(-4px);
        }


        /* Description */

        .hero-description {
            max-width: 520px;

            margin: 20px auto 0;

            color: rgba(255,255,255,0.8);

            font-size: 14px;

            line-height: 1.7;
        }


        /* =========================
           FLOATING BUBBLES
        ========================== */

        .bubble {
            position: absolute;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 30% 30%,
                    rgba(255,255,255,0.9),
                    rgba(255,255,255,0.15) 45%,
                    transparent 70%
                );

            border: 1px solid rgba(255,255,255,0.25);

            z-index: 4;

            animation: floating 5s ease-in-out infinite;
        }

        .bubble1 {
            width: 55px;
            height: 55px;

            left: 12%;
            top: 12%;
        }

        .bubble2 {
            width: 25px;
            height: 25px;

            left: 30%;
            top: 40%;

            animation-delay: 1s;
        }

        .bubble3 {
            width: 65px;
            height: 65px;

            right: 15%;
            top: 13%;

            animation-delay: 2s;
        }

        .bubble4 {
            width: 40px;
            height: 40px;

            right: 25%;
            bottom: 15%;

            animation-delay: 1.5s;
        }


        /* =========================
           ANIMATIONS
        ========================== */

        @keyframes floating {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-18px);
            }

        }


        @keyframes rotateCircle {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }


        @keyframes rotateReverse {

            from {
                transform: rotate(360deg);
            }

            to {
                transform: rotate(0deg);
            }

        }


        /* =========================
           MOBILE RESPONSIVE
        ========================== */

        @media (max-width: 900px) {

            .navbar {
                height: 75px;
            }

            .nav-links,
            .nav-btns {
                display: none;
            }

            .mobile-menu {
                display: block;
            }

            .hero {
                min-height: 760px;
            }

            .machine {
                width: 100%;
                opacity: 0.28;
            }

            .right-machine {
                display: none;
            }

            .left-machine {
                clip-path: none;
            }

            .hero-content {
                padding-top: 20px;
            }

            .hero-title {
                font-size: 50px;
            }

        }


        @media (max-width: 500px) {

            .logo {
                font-size: 20px;
            }

            .circle-wrapper {
                width: 240px;
                height: 240px;
            }

            .circle-wrapper::before {
                width: 270px;
                height: 270px;
            }

            .circle-wrapper::after {
                width: 290px;
                height: 290px;
            }

            .circle-image {
                width: 220px;
                height: 220px;
            }

            .dry-badge {
                width: 80px;
                height: 80px;

                right: -20px;
            }

            .dry-badge i {
                width: 30px;
                height: 30px;

                font-size: 12px;
            }

            .hero-title {
                font-size: 43px;
            }

            .hero-buttons {
                gap: 8px;
            }

            .hero-buttons a {
                padding: 13px 17px;
                font-size: 11px;
            }

            .premium-text {
                font-size: 8px;
                letter-spacing: 2px;
            }

            .premium-text::before,
            .premium-text::after {
                width: 35px;
            }

            .hero-description {
                padding: 0 20px;
                font-size: 12px;
            }

        }

    </style>
</head>

<body>


<!-- =========================

========================= -->

<script>

    /* Simple Mobile Menu Button */

    const mobileMenu = document.getElementById("mobileMenu");

    mobileMenu.addEventListener("click", function () {

        const nav = document.querySelector(".nav-links");

        if (nav.style.display === "flex") {

            nav.style.display = "none";

        } else {

            nav.style.display = "flex";

            nav.style.position = "absolute";

            nav.style.top = "75px";

            nav.style.left = "0";

            nav.style.width = "100%";

            nav.style.flexDirection = "column";

            nav.style.gap = "0";

            nav.style.padding = "20px";

    });

</script>
